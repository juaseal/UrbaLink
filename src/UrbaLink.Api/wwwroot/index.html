<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#176b57"><meta name="description" content="Tu comunidad, más cerca. Comparte, pide ayuda y habla con tus vecinos desde UrbaLink."><title>UrbaLink · Tu comunidad</title><link rel="icon" href="/assets/mark.svg" type="image/svg+xml"><link rel="stylesheet" href="/assets/app.css"><script type="module" src="/assets/app.js"></script></head>
<body><header class="topbar"><a class="brand" href="#home" aria-label="UrbaLink, inicio"><img src="/assets/mark.svg" alt="" width="36" height="36">UrbaLink</a><span class="tagline">La vida en tu urba, un poco más fácil.</span><button id="bell" hidden class="bell" aria-label="Mensajes privados"><img class="ui-icon" src="/assets/icons/bell.svg" alt="" aria-hidden="true" width="24" height="24">Mensajes <span id="unread"></span></button></header>

iv></form><div id="view" tabindex="-1"></div></section><noscript><p>Activa JavaScript en tu navegador para acceder a UrbaLink.</p></noscript></main>

<footer class="site-footer">UrbaLink · Un lugar para tus vecinos.</footer></body></html>
